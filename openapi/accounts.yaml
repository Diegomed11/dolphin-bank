openapi: 3.1.0
info:
  title: Bank Dolphin - Cuentas
  version: 0.1.0
  description: Contrato del dominio de Cuentas. Saldos en centavos (entero).
servers:
  - url: http://localhost:8000
    description: Local
paths:
  /accounts:
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Abrir una cuenta
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPublic' }
        '401': { description: No autenticado }
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: Listar mis cuentas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de cuentas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountPublic' }
  /accounts/{account_id}/balance:
    get:
      operationId: getBalance
      tags: [accounts]
      summary: Consultar saldo (derivado del ledger)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saldo actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResponse' }
        '403': { description: La cuenta no pertenece al usuario (control IDOR) }
        '404': { description: Cuenta no encontrada }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateAccountRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [checking, savings] }
        currency: { type: string, minLength: 3, maxLength: 3, default: MXN }
    AccountPublic:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [checking, savings] }
        currency: { type: string }
        status: { type: string }
    BalanceResponse:
      type: object
      properties:
        account_id: { type: string }
        balance_cents: { type: integer, description: Saldo en centavos }
        currency: { type: string }
